[project]
name = "streamora"
version = "0.1.0"
description = "Backend integration layer connecting marketplace Open Platforms with internal systems"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    "cryptography>=50.0.1",
    "authlib>=1.8.0",
    "itsdangerous>=2.2.0",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "freezegun>=1.5",
    "faker>=30.0",
    "black>=24.10",
    "ruff>=0.8",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.8",
    "types-authlib>=1.7.2.20260827",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ARG", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# session-scoped async fixture (db_engine) ต้องอยู่ใน event loop เดียวกับ test
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra -q --cov=app --cov-report=term-missing --cov-fail-under=80"
markers = [
    "sandbox: ยิง sandbox จริง — ไม่รันใน CI (deselect ด้วย -m 'not sandbox')",
]

[tool.coverage.run]
# SQLAlchemy async รันโค้ดผ่าน greenlet — ถ้าไม่ตั้งค่านี้ coverage จะรายงาน
# บรรทัดหลัง await ว่าไม่ถูกรัน ทั้งที่รันจริง
concurrency = ["thread", "greenlet"]
omit = ["*/tests/*", "*/migrations/*", "*/alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    "@(abc\\.)?abstractmethod",
    "@overload",
]
