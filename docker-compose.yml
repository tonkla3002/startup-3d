services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: streamora
      POSTGRES_PASSWORD: streamora
      POSTGRES_DB: streamora
    ports:
      # 5432 บนเครื่องนี้ถูก cluster etl-pipeline ใช้อยู่ เลยใช้ 55432 แทน
      - "55432:5432"
    volumes:
      - streamora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamora"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  streamora_pgdata:
